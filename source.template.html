function spawnWave(){game.waves++;const n=game.room;let positions;if(n===1&&game.waves===1)positions=[760];else{const count=n<=3?2:3;positions=[];for(let i=0;i<count;i++)positions.push(560+i*(480/(count-1||1)))}game.enemies.push(...positions.map((x,i)=>makeEnemy(x,i+game.waves)));notify(n===1&&game.waves===1?'01 · 검의 예고를 읽어 보세요':`추가 기사 ${positions.length}명 · ${game.waves}/${waveCount(n)} 물결`)}
function room(n){game.room=n;doorAnim=null;trans=null;fade=0;game.waves=0;game.waveDelay=0;game.enemies=[];game.p.x=210;game.p.y=FLOOR;game.p.vy=0;game.p.atk=0;game.p.dash=0;game.p.dashCD=0;game.p.skill=0;game.p.skillCD=0;game.p.invul=.8;keys.clear();drops=[];projectiles=[];effects=[];game.lootPool=lootPoolFor(n);game.lootDropped=0;game.rewarded=false;phase=n===BOSS_ROOM?'boss':'combat';if(n===BOSS_ROOM){game.enemies=[makeEnemy(920,0,true)];notify('최종 수문장 · 강타는 점프, 돌진은 대시로 피하세요.');tone(80,.45,'triangle')}else spawnWave();log(n===1?'기사는 준비 → 공격 → 회복 순서로 움직입니다.':n===BOSS_ROOM?'망치가 내려간 뒤의 긴 빈틈을 노리세요.':'화랑 '+n+' · 기사 '+waveCount(n)+' 물결을 돌파하세요.');hideOverlay()}
function enemyDeath(e){if(e.dead)return;e.dead=.001;e.state='death';game.stats.kills++;tone(e.boss?90:130,.15,'triangle');for(let i=0;i<3;i++)drops.push({x:e.x+(i-1)*20,y:FLOOR-20,vx:(i-1)*70,vy:-180-i*20,value:game.room<=2?4:5,t:0});if(!e.boss&&game.stats.kills%3===0)drops.push({x:e.x,y:FLOOR-20,vx:40,vy:-250,heal:12,t:0});if(!e.boss&&game.lootPool&&game.lootPool.length&&game.lootDropped<2){const allDead=game.enemies.every(x=>x.dead);const isFinal=allDead&&game.waves>=waveCount(game.room);if((isFinal&&game.lootDropped===0)||Math.random()<.5){const loot=game.lootPool.splice(Math.floor(Math.random()*game.lootPool.length),1)[0];game.lootDropped++;drops.push({x:e.x,y:FLOOR-40,vx:(Math.random()-.5)*80,vy:-250,loot,t:0});notify('몬스터가 전리품을 떨어뜨렸습니다 · '+LOOTNAMES[loot])}}if(e.boss){phase='bossClear';game.bossClearTime=0;game.bossDoor=false;for(const d of drops){if(d.value)game.coins+=d.value;else if(d.loot)applyLoot(d.loot)}drops=[];game.coins+=40;keys.clear();log('최종 수문장을 쓰러뜨렸습니다 · 빛의 문이 열립니다.');notify('빛의 문이 열렸습니다 · 안으로 들어가세요');}}
function damageEnemy(e,amount,reason){if(!['combat','boss'].includes(phase)||e.dead)return;let final=amount;if(reason==='검'&&e.shield&&e.state!=='recover')final=Math.max(3,amount-5);e.hp=Math.max(0,e.hp-final);e.hit=.16;floaters.push({x:e.x,y:e.y-(e.boss?150:110),text:String(final)+(reason==='시너지'?' ✦':''),color:reason==='시너지'?'#cfa7ff':'#f3d68a',t:0});game.stats.damage=(game.stats.damage||0)+final;log(`${reason} ${final} 피해 · ${e.boss?'수문장':'기사'} ${e.hp}/${e.maxHp}`);tone(reason==='시너지'?540:270,.07,'triangle');{const pc=reason==='시너지'?'#b48bff':reason==='강타'?'#ffb15e':reason==='연격'?'#9fe3ff':'#f4d66e';const oy=e.y-55;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,sp=50+Math.random()*230;particles.push({x:e.x,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,color:pc,t:0,size:2+Math.random()*5,life:.3+Math.random()*.3})}for(let i=0;i<6;i++)particles.push({x:e.x,y:oy,vx:(Math.random()-.5)*70,vy:-150-Math.random()*180,color:'#ffffff',t:0,size:1+Math.random()*2,life:.5});for(let i=0;i<4;i++)particles.push({x:e.x+(Math.random()-.5)*40,y:oy+(Math.random()-.5)*30,vx:(Math.random()-.5)*90,vy:-40-Math.random()*90,color:'#ffd9a3',t:0,size:3+Math.random()*3,life:.4})}if(e.hp<=0)enemyDeath(e)}
function hurt(e){const p=game.p;if(!['combat','boss'].includes(phase)||p.invul>0||p.hp<=0)return;if(game.shieldCharges>0){game.shieldCharges--;p.invul=Math.max(p.invul,.8);effects.push({type:'hit_impact',x:p.x,y:p.y-45,t:0,scale:.8});floaters.push({x:p.x,y:p.y-90,text:'방어!',color:'#9fe3ff',t:0});notify('수호의 부적 · 공격을 1회 막았습니다');tone(420,.18,'triangle');hud();return}p.hp=Math.max(0,p.hp-(e.boss?29:16));p.hit=.23;p.invul=.85;p.atk=0;p.x=Math.max(40,Math.min(1240,p.x+e.swingDir*35));game.stats.hits++;effects.push({type:'hit_impact',x:p.x,y:p.y-45,t:0,scale:.55});tone(75,.18,'sawtooth',.03);notify(`피격! ${e.boss?'망치가 내려간 뒤':'기사가 검을 내린 뒤'} 반격해 보세요.`);if(p.hp===0){phase='failure';game.failureCause=e.boss?'boss':'knight';game.terminalTime=0;game.stats.duration=+elapsed.toFixed(1);keys.clear();projectiles=[];drops=[];log(e.boss?'최종 수문장에게 쓰러졌습니다.':'기사에게 쓰러졌습니다.');}}
function proceedStage(){if(game.room%SHOP_EVERY===0){log('화랑 '+game.room+' 정리 완료 · 상점 화랑으로 이동합니다.');enterShop()}else{log('화랑 '+game.room+' 정리 완료 · 다음 화랑으로');walkThroughDoor(()=>room(game.room+1))}}
function reward(){game.rewarded=true;for(const d of drops){if(d.value)game.coins+=d.value;else if(d.heal)game.p.hp=Math.min(100,game.p.hp+d.heal);else if(d.loot)applyLoot(d.loot)}drops=[];game.coins+=25+game.room*5;game.enemies=[];hud();if(Math.random()<.3){notify('보물 상자가 떨어졌습니다! 상자에 다가가 여세요');drops.push({x:640,y:FLOOR-40,vx:0,vy:-220,chest:true,t:0})}else proceedStage()}
function openChest(){phase='chest';paused=true;uiMode='chest';keys.clear();jumpQueued=false;overlay('<div class="eyebrow">보물 상자</div><h2>상자가 열렸습니다</h2><p class="desc">세 가지 보상 중 하나를 선택하세요.</p><div class="choices"><button class="choice" id="chestPotion"><canvas class="icon" data-icon="healing_potion" width="64" height="64"></canvas><b>회복물약</b><br><span class="small">즉시 체력 40 회복</span></button><button class="choice" id="chestShield"><canvas class="icon" data-icon="synergy_emblem" width="64" height="64"></canvas><b>수호의 부적</b><br><span class="small">다음 피격 1회를 막아줍니다</span></button><button class="choice" id="chestPower"><canvas class="icon" data-icon="steel_weapon" width="64" height="64"></canvas><b>예리한 숫돌</b><br><span class="small">공격력 +3</span></button></div>');$('#chestPotion').onclick=()=>pickChest('potion');$('#chestShield').onclick=()=>pickChest('shield');$('#chestPower').onclick=()=>pickChest('power');renderUISkins();iconCanvases();hud()}
function pickChest(kind){if(kind==='potion'){game.p.hp=Math.min(100,game.p.hp+40);log('상자 보상: 회복물약 +40');notify('회복물약 +40')}else if(kind==='shield'){game.shieldCharges=(game.shieldCharges||0)+1;log('상자 보상: 수호의 부적 (피격 1회 방어)');notify('수호의 부적 · 다음 피격 1회 방어')}else{game.weaponUpgrade+=3;log('상자 보상: 공격력 +3');notify('공격력 +3')}tone(650,.18,'triangle');closeChest()}
function closeChest(){paused=false;uiMode=null;hideOverlay();hud();proceedStage()}
function essenceRoom(){phase='essence';doorAnim=null;trans=null;fade=1;game.essenceTaken=false;game.essenceTime=0;const p=game.p;p.x=150;p.y=FLOOR;p.vy=0;p.grounded=true;p.dir=1;p.hit=0;p.dash=0;p.dashCD=0;p.skill=0;p.atk=0;p.invul=0;p.moving=false;keys.clear();jumpQueued=false;game.enemies=[];log('빛의 정수 방 · 가운데의 정수에 다가가세요.');notify('방 가운데의 정수를 얻으세요');hud()}
function updateEssence(dt){updateShopPlayer(dt);const p=game.p;if(!game.essenceTaken&&Math.abs(p.x-640)<72){game.essenceTaken=true;game.essence=true;game.p.hp=p.maxHp;game.weaponUpgrade+=5;game.shieldCharges=(game.shieldCharges||0)+2;notify('빛의 정수를 얻었습니다!');log('빛의 정수 획득 · 완전 회복 + 공격력 +5 + 수호 부적 2');tone(760,.3,'triangle');for(let i=0;i<44;i++){const a=Math.random()*Math.PI*2,sp=60+Math.random()*280;particles.push({x:640,y:FLOOR-120,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,color:Math.random()<.5?'#f4d66e':'#ffffff',t:0,size:2+Math.random()*5,life:.6})}return}if(game.essenceTaken){game.essenceTime=(game.essenceTime||0)+dt;if(game.essenceTime>1&&phase==='essence'){phase='victory';game.terminalTime=0;game.stats.duration=+elapsed.toFixed(1);keys.clear()}}}
function enterShop(){if(phase==='shop')return;walkThroughDoor(()=>shopRoom())}
function shopRoom(){phase='shop';doorAnim=null;trans=null;fade=1;const p=game.p;p.x=150;p.y=FLOOR;p.vy=0;p.grounded=true;p.dir=1;p.hit=0;p.dash=0;p.dashCD=0;p.atk=0;p.invul=0;p.moving=false;game.selected=null;game.potionBought=false;game.shopSel=-1;game.shopBuyCD=.4;game.shopPrompt='A D 이동 · K 대시 · 진열대 앞에서 J 구매 · 오른쪽 문에서 J 이동';keys.clear();jumpQueued=false;game.enemies=[];log('상점 화랑 · 진열대 앞에서 J로 구매하세요.');notify('상점 화랑 · J: 구매 / K: 대시 / 오른쪽 문에서 J: 다음 화랑');hud()}
function updateShopPlayer(dt){const p=game.p;p.invul=Math.max(0,p.invul-dt);p.hit=Math.max(0,p.hit-dt);p.dashCD=Math.max(0,p.dashCD-dt);const direction=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);if(direction&&p.dash<=0)p.dir=direction;if(jumpQueued){if(p.grounded&&p.dash<=0){p.vy=-750;p.grounded=false;tone(260,.06,'sine')}jumpQueued=false}if(keys.has('k')&&p.dashCD<=0){p.dash=.28;p.dashCD=1.35;p.invul=Math.max(p.invul,.28);p.vy=0;p.dashDir=p.dir;effects.push({type:'dash_trail',x:p.x-p.dir*50,y:p.y-42,t:0,scale:.6,dir:p.dir});tone(210,.1,'sawtooth',.014);game.stats.dodges++}if(p.dash>0){p.dash-=dt;p.x+=p.dashDir*760*dt;p.vy=0;p.moving=false}else{let old=p.y;p.vy+=1800*dt;p.y+=p.vy*dt;p.grounded=false;if(p.vy>=0&&old<=FLOOR+2&&p.y>=FLOOR){p.y=FLOOR;p.vy=0;p.grounded=true}p.x+=direction*230*dt;p.runTime=(p.runTime||0)+dt;p.moving=!!direction}p.x=Math.max(70,Math.min(1210,p.x));p.atk=0}
function purchaseGood(x){if(game.inventory.includes(x.id)||(x.id==='potion'&&game.potionBought)){notify(x.name+'은(는) 이미 보유/구매했습니다.');tone(90,.06);return}if(game.coins<x.price){notify('코인 부족 · '+(x.price-game.coins)+' 코인 더 필요');log('구매 불가: 돈 부족');tone(90,.08);return}let before=[magic(),breaker()];game.coins-=x.price;if(x.id==='potion'){game.p.hp=Math.min(100,game.p.hp+35);game.potionBought=true}else game.inventory.push(x.id);game.stats.purchases.push({item:x.id,price:x.price,time:+elapsed.toFixed(1)});let activated=(!before[0]&&magic())||(!before[1]&&breaker());log(x.name+' 구매 완료'+(activated?' · 시너지 활성':''));tone(activated?650:440,.2,'triangle');notify(x.name+' 구매 완료 · 코인 '+game.coins)}
function leaveShopCorridor(){walkThroughDoor(()=>room(game.room+1),1140,true)}
function salvageValue(x){return Math.max(5,Math.round(x.price*.6))}
function openInventory(){if(['title','loading','failure','victory','error'].includes(phase)||paused)return;paused=true;uiMode='inventory';keys.clear();jumpQueued=false;$('#pause').textContent='일시정지';renderInventory()}
function renderInventory(){const items=game.inventory.slice();const rows=items.length?items.map((id,i)=>{const x=GOODS.find(g=>g.id===id);return '<button class="invRow" data-inv="'+i+'"><canvas class="icon" data-icon="'+x.icon+'" width="48" height="48"></canvas><b>'+x.name+'</b><span class="small">부수기 · +'+salvageValue(x)+' 코인</span></button>'}).join(''):'<p class="desc">보유한 아이템이 없습니다. 몬스터를 처치하거나 상점에서 구매하세요.</p>';const extra=game.weaponUpgrade>0?'<p class="desc">검 연마 강화: +'+game.weaponUpgrade+' (영구)</p>':'';overlay('<div class="eyebrow">인벤토리</div><h2>보유 아이템</h2><p class="desc">현재 코인 ◈ '+game.coins+' · 시너지: '+combinations(game.inventory)+'</p>'+extra+'<div class="invList">'+rows+'</div><div class="row"><button id="invClose" class="primary">닫기</button><span class="small">부수면 아이템이 사라지고 코인을 얻습니다.</span></div>');for(const b of document.querySelectorAll('[data-inv]'))b.onclick=()=>salvageItem(+b.dataset.inv);$('#invClose').onclick=closeInventory;renderUISkins();iconCanvases()}
function salvageItem(i){const id=game.inventory[i];if(!id)return;const x=GOODS.find(g=>g.id===id);const v=salvageValue(x);game.inventory.splice(i,1);game.coins+=v;log(x.name+' 부수기 · +'+v+' 코인');tone(500,.12,'triangle');notify(x.name+' 부수기 · +'+v+' 코인');hud();renderInventory()}
function closeInventory(){paused=false;uiMode=null;$('#pause').textContent='일시정지';hideOverlay()}
function updateShop(dt){updateShopPlayer(dt);game.shopBuyCD=Math.max(0,(game.shopBuyCD||0)-dt);let sel=-1,best=1e9;GOODS.forEach((g,i)=>{const d=Math.abs(game.p.x-SHOPX[i]);if(d<98&&d<best){best=d;sel=i}});game.shopSel=sel;const nearDoor=game.p.x>1095;if(keys.has('j')&&game.shopBuyCD<=0){if(sel>=0){purchaseGood(GOODS[sel]);game.shopBuyCD=.45}else if(nearDoor){leaveShopCorridor();return}}if(sel>=0){const g=GOODS[sel];game.shopPrompt='J: '+g.name+' 구매 ('+g.price+' ◈)'}else if(nearDoor){game.shopPrompt='J: 다음 화랑으로'}else{game.shopPrompt='A D 이동 · K 대시 · 진열대 앞에서 J 구매 · 오른쪽 문에서 J 이동'}}
function combinations(inv){let a=[];if(magic(inv))a.push('흑월: 공격에 유도탄 12 피해');if(breaker(inv))a.push('균열: 회복 중인 적에 +15 피해');return a.length?a.join(' · '):'완성된 시너지 없음'}
function renderShop(message=''){overlay('<div class="eyebrow">상점 · '+(game.room===1?'무너진 회랑 뒤':'최종 성문 앞')+'</div><div class="row" style="justify-content:space-between"><h2>지금 생존, 또는 원하는 조합</h2><div class="coinPlate"><canvas class="cardSkin" data-ui="coin_sign" width="150" height="45"></canvas><b class="gold" id="shopCoins">'+game.coins+'</b></div></div><p class="desc">체력 '+game.p.hp+'/100 · 보유: '+(game.inventory.map(id=>GOODS.find(x=>x.id===id)?.name).join(', ')||'없음')+'</p><div class="cards">'+GOODS.map(x=>'<button class="shopCard '+(game.selected===x.id?'selected':'')+' '+(game.inventory.includes(x.id)?'owned':'')+'" data-item="'+x.id+'"><canvas class="cardSkin" data-ui="'+(game.inventory.includes(x.id)||(x.id==='potion'&&game.potionBought)?'button_disabled':game.selected===x.id?'button_selected':'button_normal')+'" width="150" height="170"></canvas><canvas class="icon" data-icon="'+x.icon+'" width="64" height="64"></canvas><span class="itemName">'+x.name+'</span><div class="itemPrice">'+(game.inventory.includes(x.id)?'보유 중':x.id==='potion'&&game.potionBought?'구매 완료':x.price+' 코인')+'</div></button>').join('')+'</div><div class="previewBox" id="purchasePreview">상품을 선택하면 설명과 구매 후 예상 시너지가 표시됩니다.<br>현재: '+combinations(game.inventory)+'</div><p class="status" id="shopStatus">'+message+'</p><div class="row"><button id="buy" class="primary" disabled>상품을 선택하세요</button><button id="leaveShop">'+(game.room===1?'두 번째 회랑으로':'최종 수문장에게')+'</button><span class="small">구매할 때만 코인이 차감됩니다.</span></div>');for(const b of document.querySelectorAll('[data-item]'))b.onclick=()=>selectItem(b.dataset.item);$('#buy').onclick=buy;$('#leaveShop').onclick=()=>{walkThroughDoor(()=>room(game.room+1))};iconCanvases();hud()}

function door(){drawDoor(game.room===BOSS_ROOM?1090:1080,410,115,190,doorAnim?doorAnim.open:0)}
function drawPedestal(g,i){const x=SHOPX[i],owned=game.inventory.includes(g.id)||(g.id==='potion'&&game.potionBought),sel=game.shopSel===i,bob=sel?Math.sin(visualTime*5)*4:0;art('tiles','pillar_cap',x-46,FLOOR-72,92,34,true);art('tiles','platform_underside',x-38,FLOOR-58,76,40,true);art('support',g.icon,x-30,FLOOR-140+bob,60,60);ctx.textAlign='center';ctx.fillStyle=sel?'#f4d66e':'#c8b3dc';ctx.font='bold 15px Malgun Gothic, system-ui';ctx.fillText(g.name,x,FLOOR-82+bob);ctx.fillStyle=owned?'#7fd6a3':'#e6c77a';ctx.font='13px Malgun Gothic, system-ui';ctx.fillText(owned?'보유 중':(g.id==='potion'&&game.potionBought?'구매 완료':g.price+' ◈'),x,FLOOR-64+bob);if(sel){ctx.strokeStyle='#f4d66e';ctx.lineWidth=2;ctx.strokeRect(x-36,FLOOR-152+bob,72,86);ctx.fillStyle='#f4d66e';ctx.font='12px Malgun Gothic, system-ui';ctx.fillText('J 구매',x,FLOOR-30)}}
function bgShop(){ctx.fillStyle='#1a1524';ctx.fillRect(0,0,W,H);ctx.globalAlpha=.5;for(let y=100;y<600;y+=160)for(let x=0;x<1280;x+=180)art('tiles',(x/180+y/160)%2<1?'recess_wall':'wall_b',x,y,180,160,true);ctx.globalAlpha=1;const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#120e1df0');g.addColorStop(.5,'#211b3244');g.addColorStop(1,'#0f0b18dd');ctx.fillStyle=g;ctx.fillRect(0,0,1280,610);art('tiles','arch_left',24,150,180,360,true);art('tiles','arch_center',300,150,220,360,true);art('tiles','arch_center',558,150,220,360,true);art('tiles','arch_center',816,150,220,360,true);art('tiles','arch_right',1080,150,180,360,true);art('tiles','torch',150,300,30,78,true);art('tiles','torch',1130,300,30,78,true);ctx.fillStyle='#f5a347';ctx.globalAlpha=.03+.012*Math.sin(visualTime*9);ctx.beginPath();ctx.arc(165,325,110,0,Math.PI*2);ctx.arc(1145,325,110,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let x=0;x<1280;x+=160)art('tiles','platform_center',x,FLOOR,162,62,true);ctx.fillStyle='#110d19';ctx.fillRect(0,657,W,63);ctx.fillStyle='#3a2740';ctx.globalAlpha=.7;ctx.fillRect(110,FLOOR-5,1060,10);ctx.globalAlpha=1;drawDoor(30,410,115,190,0);drawDoor(1140,410,115,190,1);GOODS.forEach((g,i)=>drawPedestal(g,i))}
function bgEssence(){ctx.fillStyle='#141126';ctx.fillRect(0,0,W,H);ctx.globalAlpha=.5;for(let y=100;y<600;y+=160)for(let x=0;x<1280;x+=180)art('tiles',(x/180+y/160)%2<1?'recess_wall':'wall_b',x,y,180,160,true);ctx.globalAlpha=1;const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#0f0c1cf0');g.addColorStop(.5,'#201a3244');g.addColorStop(1,'#0c0916dd');ctx.fillStyle=g;ctx.fillRect(0,0,1280,610);art('tiles','distant_castle',450,150,380,210);ctx.fillStyle='#141126aa';ctx.fillRect(450,150,380,210);art('tiles','pillar',60,150,70,440,true);art('tiles','pillar',1150,150,70,440,true);art('tiles','torch',150,300,30,78,true);art('tiles','torch',1100,300,30,78,true);for(let x=0;x<1280;x+=160)art('tiles','platform_center',x,FLOOR,162,62,true);ctx.fillStyle='#110d19';ctx.fillRect(0,657,W,63);art('tiles','pillar_cap',560,FLOOR-58,160,40,true);ctx.fillStyle='#3a2f52';ctx.fillRect(60,FLOOR-5,1160,10);if(!game.essenceTaken){const pulse=.5+.5*Math.sin(visualTime*3),cx=640,cy=FLOOR-120,rg=ctx.createRadialGradient(cx,cy,4,cx,cy,90);rg.addColorStop(0,'#fff6cf');rg.addColorStop(.35,'#f4d66e');rg.addColorStop(1,'#f4d66e00');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,90,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff6cf';ctx.beginPath();ctx.arc(cx,cy,18+4*pulse,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4d66e';ctx.lineWidth=2;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(cx,cy,34+12*pulse,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}
function openDoor(){if(!doorAnim)doorAnim={open:0,target:1}}
function walkThroughDoor(onDone,doorX,fromShop){phase='transition';if(!doorAnim)doorAnim={open:0,target:1};else doorAnim.target=1;trans={t:0,onDone,doorX,fromShop:!!fromShop};fade=0;keys.clear();game.enemies=[];hideOverlay()}
function render(){if(!game)return;ctx.imageSmoothingEnabled=false;bg();for(const e of game.enemies){ctx.fillStyle='#0d0a1580';ctx.beginPath();ctx.ellipse(e.x,FLOOR+5,e.boss?55:35,8,0,0,Math.PI*2);ctx.fill();if(e.dead>1.2)continue;let role='idle',t=e.time,forced;if(e.dead){role='death';t=e.dead}else if(e.hit>0){role='hit';t=.16-e.hit}else if(e.state==='entry'||e.state==='leap'){role='jump';forced=e.vy<0?2:4}else if(e.state==='walk'){role=Math.abs(game.p.x-e.x)>115?'run':'idle'}else if(e.state==='windup'){role='attack';forced=Math.min(1,Math.floor(e.time/e.total*2));const x=e.x+(e.swingDir===1?0:-(e.boss?210:140));ctx.fillStyle='#ee706b33';ctx.fillRect(x,FLOOR-12,e.boss?210:140,12);ctx.strokeStyle='#ee706b';ctx.lineWidth=2;ctx.strokeRect(x,FLOOR-12,e.boss?210:140,12);ctx.fillStyle='#f7b383';ctx.font='bold 19px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText(e.boss?(e.pattern===1?'▶ 突進'.replace('突進','돌진'):e.pattern===2?'↑ 도약 강타':'! 강타'):'! 검 준비',e.x,e.y-(e.boss?190:135));ctx.fillStyle='#574050';ctx.fillRect(e.x-34,e.y-(e.boss?173:122),68,4);ctx.fillStyle='#ee706b';ctx.fillRect(e.x-34,e.y-(e.boss?173:122),68*Math.min(1,e.time/e.total),4)}else if(e.state==='charge'){role='dash';t=e.time}else if(e.state==='attack'){role='attack';forced=e.time<.1?2:3;ctx.save();ctx.translate(e.x+e.swingDir*(e.boss?80:60),e.y-44);ctx.scale(e.swingDir,1);ctx.strokeStyle='#ee706b';ctx.lineWidth=e.boss?8:5;ctx.beginPath();ctx.arc(0,0,e.boss?88:60,-1,1.5);ctx.stroke();ctx.restore()}else if(e.state==='recover'){role='attack';forced=e.time<.3?4:5;ctx.fillStyle='#b48bff';ctx.font='13px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText('빈틈',e.x,e.y-(e.boss?172:146))}sprite(e.actor,role,t,e.x,e.y,e.boss?170:110,e.dir,forced);if(!e.boss&&!e.dead){ctx.fillStyle='#3b293e';ctx.fillRect(e.x-28,e.y-130,56,5);ctx.fillStyle='#cf8c9c';ctx.fillRect(e.x-28,e.y-130,56*e.hp/e.maxHp,5)}}const p=game.p;ctx.fillStyle='#0d0a1580';ctx.beginPath();ctx.ellipse(p.x,p.grounded?p.y+5:FLOOR+5,29,7,0,0,Math.PI*2);ctx.fill();let role='idle',t=visualTime,forced;if(phase==='failure'){role='death';t=game.terminalTime}else if(p.hit>0){role='hit';t=.23-p.hit}else if(p.skill>0){role='dash';t=Math.max(0,.28-p.skill)}else if(p.dash>0){role='dash';t=.28-p.dash}else if(p.atk>0){role='attack';t=p.atkTime}else if(!p.grounded&&phase!=='title'){role='jump';forced=p.vy<0?2:p.vy>150?4:3}else if(p.moving){role='run';t=p.runTime}sprite('hero',role,t,p.x,p.y,82,p.dir,forced,p.invul>0&&p.dash<=0&&Math.floor(visualTime*12)%2?.55:1);for(const e of effects)effect(e.type,e.t,e.x,e.y,e.scale,e.dir||1);for(const b of projectiles)effect('synergy_bolt',visualTime% .48,b.x,b.y,.42,b.vx<0?-1:1);for(const d of drops){if(d.chest){ctx.fillStyle='#f4d66e';ctx.globalAlpha=.45+.3*Math.sin(visualTime*6);ctx.beginPath();ctx.arc(d.x,d.y-14,28,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#8a5a2b';ctx.fillRect(d.x-18,d.y-30,36,30);ctx.fillStyle='#c98a3f';ctx.fillRect(d.x-18,d.y-38,36,12);ctx.fillStyle='#f4d66e';ctx.fillRect(d.x-4,d.y-22,8,8);ctx.strokeStyle='#3a2412';ctx.lineWidth=2;ctx.strokeRect(d.x-18,d.y-38,36,38);continue}if(d.loot){ctx.globalAlpha=.9;ctx.fillStyle='#f4d66e';ctx.beginPath();ctx.arc(d.x,d.y-8,13,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}art('support',d.value?'coin':d.loot?(LOOTICON[d.loot]||'coin'):'healing_potion',d.x-(d.loot?12:10),d.y-(d.loot?20:17),d.loot?24:20,d.loot?28:24)}for(const a of particles){ctx.globalAlpha=Math.max(0,1-a.t/(a.life||.45));ctx.fillStyle=a.color;const s=a.size||4;ctx.fillRect(a.x-s/2,a.y-s/2,s,s)}for(const f of floaters){ctx.fillStyle=f.color;ctx.globalAlpha=1-f.t/.85;ctx.font='bold 21px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;hud();if(fade>0){ctx.fillStyle='rgba(8,6,14,'+fade.toFixed(3)+')';ctx.fillRect(0,0,W,H)}}
function hud(){if(!game)return;const p=game.p;$('#hptext').textContent=p.hp+' / '+p.maxHp+(game.shieldCharges>0?'  ·  방어 '+game.shieldCharges:'');$('#hpfill').style.width=p.hp/p.maxHp*100+'%';$('#hudCoins').textContent='◈ '+game.coins;$('#dashfill').style.width=Math.max(0,1-p.dashCD/1.35)*100+'%';$('#dashtext').textContent=(p.dashCD>0?'K 대시 '+p.dashCD.toFixed(1)+'초':'K 대시 준비')+' · '+(p.skillCD>0?'E 강타 '+p.skillCD.toFixed(1)+'초':'E 강타 준비');$('#room').textContent=phase==='title'?'망각의 성':phase==='shop'?'✦ 상점 화랑':game.room===BOSS_ROOM?'최종 성문':'화랑 '+String(game.room).padStart(2,'0')+' / '+(STAGE_NAMES[game.room]||'');$('#hint').textContent=phase==='shop'?'상점 화랑 · '+(game.shopPrompt||''):'A D 이동 · Space 점프 · J 공격 · K 대시 · E 강타 · Esc 일시정지';$('#synergies').textContent=combinations(game.inventory);const b=game.enemies.find(e=>e.boss);$('#bossbar').style.display=b&&!['shop','reward'].includes(phase)?'block':'none';if(b){$('#bossfill').style.width=b.hp/b.maxHp*100+'%';$('#bossname').textContent='최종 수문장 · '+b.hp+' / '+b.maxHp+(b.hp<b.maxHp/2?' · 격노':'')}const root=$('#game');root.dataset.state=phase;root.dataset.paused=String(paused);root.dataset.room=game.room;root.dataset.hp=p.hp;root.dataset.coins=game.coins;root.dataset.heroX=p.x.toFixed(1);root.dataset.heroY=p.y.toFixed(1);root.dataset.dash=p.dashCD.toFixed(2);root.dataset.inventory=JSON.stringify(game.inventory);root.dataset.bolts=game.stats.bolts;root.dataset.bonusHits=game.stats.bonusHits;root.dataset.elapsed=elapsed.toFixed(2);root.dataset.failureCause=game.failureCause||'';root.dataset.enemies=JSON.stringify(game.enemies.filter(e=>!e.dead).map(e=>({x:+e.x.toFixed(1),y:+e.y.toFixed(1),hp:e.hp,state:e.state,boss:e.boss,dir:e.swingDir,pattern:e.pattern})));}
function togglePause(){if(['title','loading','failure','victory'].includes(phase))return;if(uiMode==='chest')return;if(!paused){paused=true;uiMode='pause';keys.clear();$('#pause').textContent='계속';overlay('<div class="eyebrow">잠시 쉬기</div><h2>모험을 멈췄습니다.</h2><p class="desc">A D 이동 · Space 점프 · J 공격 · K 대시 · E 강타<br>대시는 짧은 무적을 주고, 강타는 돌진하며 지나치는 적에게 피해를 줍니다.</p><button class="primary" id="resume">계속하기</button>');$('#resume').onclick=togglePause}else{paused=false;$('#pause').textContent='일시정지';uiMode=null;hideOverlay()}}
function rewardResume(){// Restore the already-earned reward without granting coins again.
    let saveCoins=game.coins;reward();game.coins=saveCoins;hud();
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','j','k','a','d','escape','tab'].includes(k))e.preventDefault();if(k==='escape'&&!e.repeat){togglePause();return}if(k==='tab'&&!e.repeat){if(uiMode==='inventory')closeInventory();else openInventory();return}if(k===' '&&!keys.has(k))jumpQueued=true;keys.add(k)});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();jumpQueued=false;if(['combat','boss'].includes(phase)&&!paused)togglePause()});
$('#pause').onclick=togglePause;$('#inventory').onclick=()=>{if(uiMode==='inventory')closeInventory();else openInventory()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐'};for(const b of document.querySelectorAll('#touch button')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);if(b.dataset.key===' ')jumpQueued=true};b.onpointerup=()=>keys.delete(b.dataset.key);b.onpointercancel=()=>keys.delete(b.dataset.key)}
function loop(now){const dt=Math.min(.05,(now-last)/1000)||.016;last=now;update(dt);render();requestAnimationFrame(loop)}
(async()=>{try{await Promise.all(Object.entries(window.__ASSETS__).map(async([key,a])=>{const im=new Image();im.src='data:'+a.mime+';base64,'+a.base64;await im.decode();IMG[key]=im}));title();last=performance.now();requestAnimationFrame(loop)}catch(err){phase='error';overlay('<h2>자산을 불러오지 못했습니다.</h2><p class="desc">HTML 파일이 온전히 저장됐는지 확인하세요.<br>'+String(err.message).replace(/[<>]/g,'')+'</p>');$('#game').dataset.state='error'}})();

</script>
