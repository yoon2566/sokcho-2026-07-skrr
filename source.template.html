function updatePlayer(dt){const p=game.p;p.invul=Math.max(0,p.invul-dt);p.hit=Math.max(0,p.hit-dt);p.dashCD=Math.max(0,p.dashCD-dt);const direction=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);if(direction&&p.dash<=0)p.dir=direction;if(jumpQueued){jump();jumpQueued=false}if(keys.has('j'))attack();if(keys.has('k'))dash();if(p.dash>0){p.dash-=dt;p.x+=p.dashDir*760*dt;p.vy=0}else{if(p.hit<=0)p.x+=direction*(p.atk>0?160:270)*dt;let old=p.y;p.vy+=1800*dt;p.y+=p.vy*dt;p.grounded=false;const surfaces=[{x:0,w:1280,y:FLOOR},...platforms()];if(p.vy>=0)for(const s of surfaces){if(p.x>s.x-14&&p.x<s.x+s.w+14&&old<=s.y+2&&p.y>=s.y){p.y=s.y;p.vy=0;p.grounded=true;break}}}p.x=Math.max(40,Math.min(1240,p.x));if(!p.grounded)p.jumpTime=(p.jumpTime||0)+dt;p.runTime=(p.runTime||0)+dt;p.moving=!!direction;if(p.atk>0){p.atk-=dt;p.atkTime+=dt;if(p.atkTime>=.22&&p.atkTime<=.37){if(!p.fired){p.fired=true;effects.push({type:'slash',x:p.x+p.dir*50,y:p.y-47,t:0,scale:.5,dir:p.dir});if(magic()&&(game.magicCD||0)<=0){const target=game.enemies.find(e=>!e.dead);if(target){projectiles.push({x:p.x+p.dir*30,y:p.y-45,vx:p.dir*500,vy:0,life:2.5,target:target.id});game.magicCD=1.8;game.stats.bolts++;log('흑월 시너지 탄 발사');tone(630,.09)}}}for(const e of game.enemies){if(e.dead||p.hitSet.has(e.id))continue;const dx=(e.x-p.x)*p.dir;if(dx>-25&&dx<125&&Math.abs(e.y-p.y)<88){p.hitSet.add(e.id);let amount=10+(game.inventory.includes('weapon')?4:0)+game.weaponUpgrade;if(e.state==='recover'){amount+=5;if(breaker()){amount+=15;game.stats.bonusHits++;effects.push({type:'hit_impact',x:e.x,y:e.y-80,t:0,scale:.8})}}damageEnemy(e,amount,'검');if(!['combat','boss'].includes(phase))return}}}}game.magicCD=Math.max(0,(game.magicCD||0)-dt)}

function updateEnemy(e,dt){if(e.dead){e.dead+=dt;return}e.hit=Math.max(0,e.hit-dt);e.time+=dt;if(e.state==='entry'){e.vy+=1600*dt;e.y+=e.vy*dt;if(e.y>=FLOOR){e.y=FLOOR;e.state='walk';e.time=0}return}if(e.state==='walk'){e.dir=game.p.x>=e.x?1:-1;let distance=Math.abs(game.p.x-e.x);if(distance>115)e.x+=e.dir*(e.boss?95:100)*dt;if(distance<150&&e.time>.5)beginWindup(e)}else if(e.state==='windup'&&e.time>=e.total){e.hitPlayer=false;e.time=0;if(e.boss&&e.pattern===2){e.state='leap';e.vy=-620}else if(e.pattern===1){e.state='charge'}else e.state='attack';tone(e.boss?85:160,.14,'triangle');}else if(e.state==='charge'){e.x+=e.swingDir*(e.boss?470:350)*dt;strikeCheck(e,e.boss?130:105);if(e.time>(e.boss?.65:.3)){e.state='recover';e.time=0;log('돌진 후 빈틈!')}}else if(e.state==='leap'){e.vy+=1800*dt;e.y+=e.vy*dt;e.x+=e.swingDir*85*dt;if(e.y>=FLOOR){e.y=FLOOR;e.state='attack';e.time=0;effects.push({type:'hit_impact',x:e.x+e.swingDir*80,y:FLOOR-10,t:0,scale:1.3});}}else if(e.state==='attack'){if(e.time>.02)strikeCheck(e,e.boss?210:140);if(e.time>.21){e.state='recover';e.time=0;log('검·망치가 내려갔습니다. 지금 반격!')}}else if(e.state==='recover'&&e.time>(e.boss?1.3:1.1)){e.state='walk';e.time=0}e.x=Math.max(60,Math.min(1220,e.x));}
function update(dt){visualTime+=dt;toastTime-=dt;if(toastTime<=0)$('#toast').style.opacity=0;if(paused)return;if(game&&['combat','boss','shop','reward'].includes(phase))elapsed+=dt;if(['victory','failure'].includes(phase)){game.terminalTime+=dt;if(phase==='victory')for(const e of game.enemies)if(e.dead)e.dead+=dt;if(game.terminalTime>1.2&&!game.endShown){game.endShown=true;end()}return}for(const e of effects)e.t+=dt;effects=effects.filter(e=>e.t<.48);for(const f of floaters){f.t+=dt;f.y-=28*dt}floaters=floaters.filter(f=>f.t<.85);for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}particles=particles.filter(p=>p.t<.45);if(!['combat','boss'].includes(phase))return;updatePlayer(dt);if(!['combat','boss'].includes(phase))return;for(const e of game.enemies){updateEnemy(e,dt);if(!['combat','boss'].includes(phase))return}for(const b of projectiles){b.life-=dt;const target=game.enemies.find(e=>e.id===b.target&&!e.dead)||game.enemies.find(e=>!e.dead);if(target){const dx=target.x-b.x,dy=target.y-(target.boss?90:55)-b.y,len=Math.hypot(dx,dy)||1;b.vx=dx/len*520;b.vy=dy/len*520;if(len<38){damageEnemy(target,12,'시너지');b.life=0}}b.x+=b.vx*dt;b.y+=b.vy*dt;}projectiles=projectiles.filter(b=>b.life>0&&b.x>-100&&b.x<W+100);for(const d of drops){d.t+=dt;d.vy+=700*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>FLOOR-15){d.y=FLOOR-15;d.vy=0;d.vx*=.9}if(d.t>.25&&Math.hypot(d.x-game.p.x,d.y-(game.p.y-25))<135){if(d.value){game.coins+=d.value;tone(720,.04,'sine',.014)}else{game.p.hp=Math.min(100,game.p.hp+d.heal);notify('회복약 +12')}d.collected=true}}drops=drops.filter(d=>!d.collected);if(phase==='combat'&&game.enemies.every(e=>e.dead)){game.waveDelay+=dt;if(game.waveDelay>1.5){game.waveDelay=0;if(game.waves<(game.room===1?3:2))spawnWave();else reward()}}}

function art(key,name,x,y,w,h,trim=false){const m=(key==='tiles'?SPRITES.tiles:SPRITES.support)[name+'_0'];if(!m)return;let [sx,sy,sw,sh]=m.rect;if(trim){let b=m.bounds;sx+=b[0];sy+=b[1];sw=b[2]-b[0];sh=b[3]-b[1]}ctx.drawImage(IMG[key],sx,sy,sw,sh,x,y,w,h)}
function effect(type,time,x,y,scale=1,dir=1){const i=Math.min(5,Math.floor(time/.08)),m=SPRITES.support[type+'_'+i];ctx.save();ctx.translate(x,y);ctx.scale(dir*scale,scale);ctx.drawImage(IMG.support,...m.rect,-128,-128,256,256);ctx.restore()}
function bg(){ctx.fillStyle='#211b32';ctx.fillRect(0,0,W,H);ctx.globalAlpha=.53;for(let y=100;y<600;y+=160)for(let x=0;x<1280;x+=180)art('tiles',(x/180+y/160)%2<1?'wall_a':'wall_b',x,y,180,160,true);ctx.globalAlpha=1;const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#130f20f0');g.addColorStop(.5,'#211b3244');g.addColorStop(1,'#120e1dcc');ctx.fillStyle=g;ctx.fillRect(0,0,1280,610);art('tiles','distant_castle',420,140,380,210);ctx.fillStyle='#211b3266';ctx.fillRect(420,140,380,210);art('tiles','pillar',55,145,70,440,true);art('tiles','pillar',1155,145,70,440,true);art('tiles','torch',155,285,34,85,true);art('tiles','torch',1090,285,34,85,true);ctx.fillStyle='#f5a347';ctx.globalAlpha=.025+.012*Math.sin(visualTime*9);ctx.beginPath();ctx.arc(170,310,120,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let x=0;x<1280;x+=160)art('tiles','platform_center',x,FLOOR,162,62,true);ctx.fillStyle='#110d19';ctx.fillRect(0,657,W,63);for(const p of platforms())art('tiles','platform_center',p.x,p.y,p.w,42,true);art('tiles','shop_door',game.room===3?1090:1080,410,115,190,true);art('tiles','rubble',620,565,85,35,true);}
function render(){if(!game)return;ctx.imageSmoothingEnabled=false;bg();for(const e of game.enemies){ctx.fillStyle='#0d0a1580';ctx.beginPath();ctx.ellipse(e.x,FLOOR+5,e.boss?55:35,8,0,0,Math.PI*2);ctx.fill();if(e.dead>1.2)continue;let role='idle',t=e.time,forced;if(e.dead){role='death';t=e.dead}else if(e.hit>0){role='hit';t=.16-e.hit}else if(e.state==='entry'||e.state==='leap'){role='jump';forced=e.vy<0?2:4}else if(e.state==='walk'){role=Math.abs(game.p.x-e.x)>115?'run':'idle'}else if(e.state==='windup'){role='attack';forced=Math.min(1,Math.floor(e.time/e.total*2));const x=e.x+(e.swingDir===1?0:-(e.boss?210:140));ctx.fillStyle='#ee706b33';ctx.fillRect(x,FLOOR-12,e.boss?210:140,12);ctx.strokeStyle='#ee706b';ctx.lineWidth=2;ctx.strokeRect(x,FLOOR-12,e.boss?210:140,12);ctx.fillStyle='#f7b383';ctx.font='bold 19px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText(e.boss?(e.pattern===1?'▶ 突進'.replace('突進','돌진'):e.pattern===2?'↑ 도약 강타':'! 강타'):'! 검 준비',e.x,e.y-(e.boss?190:135));ctx.fillStyle='#574050';ctx.fillRect(e.x-34,e.y-(e.boss?173:122),68,4);ctx.fillStyle='#ee706b';ctx.fillRect(e.x-34,e.y-(e.boss?173:122),68*Math.min(1,e.time/e.total),4)}else if(e.state==='charge'){role='dash';t=e.time}else if(e.state==='attack'){role='attack';forced=e.time<.1?2:3;ctx.save();ctx.translate(e.x+e.swingDir*(e.boss?80:60),e.y-44);ctx.scale(e.swingDir,1);ctx.strokeStyle='#ee706b';ctx.lineWidth=e.boss?8:5;ctx.beginPath();ctx.arc(0,0,e.boss?88:60,-1,1.5);ctx.stroke();ctx.restore()}else if(e.state==='recover'){role='attack';forced=e.time<.3?4:5;ctx.fillStyle='#b48bff';ctx.font='13px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText('빈틈',e.x,e.y-(e.boss?172:146))}sprite(e.actor,role,t,e.x,e.y,e.boss?170:110,e.dir,forced);if(!e.boss&&!e.dead){ctx.fillStyle='#3b293e';ctx.fillRect(e.x-28,e.y-130,56,5);ctx.fillStyle='#cf8c9c';ctx.fillRect(e.x-28,e.y-130,56*e.hp/e.maxHp,5)}}const p=game.p;ctx.fillStyle='#0d0a1580';ctx.beginPath();ctx.ellipse(p.x,p.grounded?p.y+5:FLOOR+5,29,7,0,0,Math.PI*2);ctx.fill();let role='idle',t=visualTime,forced;if(phase==='failure'){role='death';t=game.terminalTime}else if(p.hit>0){role='hit';t=.23-p.hit}else if(p.dash>0){role='dash';t=.28-p.dash}else if(p.atk>0){role='attack';t=p.atkTime}else if(!p.grounded&&phase!=='title'){role='jump';forced=p.vy<0?2:p.vy>150?4:3}else if(p.moving){role='run';t=p.runTime}sprite('hero',role,t,p.x,p.y,82,p.dir,forced,p.invul>0&&p.dash<=0&&Math.floor(visualTime*12)%2?.55:1);for(const e of effects)effect(e.type,e.t,e.x,e.y,e.scale,e.dir||1);for(const b of projectiles)effect('synergy_bolt',visualTime% .48,b.x,b.y,.42,b.vx<0?-1:1);for(const d of drops)art('support',d.value?'coin':'healing_potion',d.x-10,d.y-17,20,24);for(const a of particles){ctx.fillStyle=a.color;ctx.fillRect(a.x,a.y,4,4)}for(const f of floaters){ctx.fillStyle=f.color;ctx.globalAlpha=1-f.t/.85;ctx.font='bold 21px Malgun Gothic, system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;hud()}
function hud(){if(!game)return;const p=game.p;$('#hptext').textContent=p.hp+' / '+p.maxHp;$('#hpfill').style.width=p.hp/p.maxHp*100+'%';$('#hudCoins').textContent='◈ '+game.coins;$('#dashfill').style.width=Math.max(0,1-p.dashCD/1.35)*100+'%';$('#dashtext').textContent=p.dashCD>0?'K 대시 · '+p.dashCD.toFixed(1)+'초 후 준비':'K 대시 · 준비';$('#room').textContent=phase==='title'?'망각의 성':game.room===1?'01 / 무너진 회랑':game.room===2?'02 / 저주받은 회랑':'03 / 최종 성문';$('#synergies').textContent=combinations(game.inventory);const b=game.enemies.find(e=>e.boss);$('#bossbar').style.display=b&&!['shop','reward'].includes(phase)?'block':'none';if(b){$('#bossfill').style.width=b.hp/b.maxHp*100+'%';$('#bossname').textContent='최종 수문장 · '+b.hp+' / '+b.maxHp+(b.hp<b.maxHp/2?' · 격노':'')}const root=$('#game');root.dataset.state=phase;root.dataset.paused=String(paused);root.dataset.room=game.room;root.dataset.hp=p.hp;root.dataset.coins=game.coins;root.dataset.heroX=p.x.toFixed(1);root.dataset.heroY=p.y.toFixed(1);root.dataset.dash=p.dashCD.toFixed(2);root.dataset.inventory=JSON.stringify(game.inventory);root.dataset.bolts=game.stats.bolts;root.dataset.bonusHits=game.stats.bonusHits;root.dataset.elapsed=elapsed.toFixed(2);root.dataset.failureCause=game.failureCause||'';root.dataset.enemies=JSON.stringify(game.enemies.filter(e=>!e.dead).map(e=>({x:+e.x.toFixed(1),y:+e.y.toFixed(1),hp:e.hp,state:e.state,boss:e.boss,dir:e.swingDir,pattern:e.pattern})));}
function togglePause(){if(['title','loading','failure','victory'].includes(phase))return;if(!paused){paused=true;keys.clear();$('#pause').textContent='계속';overlay('<div class="eyebrow">잠시 쉬기</div><h2>모험을 멈췄습니다.</h2><p class="desc">A D 이동 · Space 점프 · J 공격 · K 대시<br>대시는 짧은 무적을 주고 다시 준비될 때까지 기다려야 합니다.</p><button class="primary" id="resume">계속하기</button>');$('#resume').onclick=togglePause}else{paused=false;$('#pause').textContent='일시정지';if(phase==='shop')renderShop();else if(phase==='reward')rewardResume();else hideOverlay()}}
function rewardResume(){// Restore the already-earned reward without granting coins again.
    let saveCoins=game.coins;reward();game.coins=saveCoins;hud();
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','j','k','a','d','escape'].includes(k))e.preventDefault();if(k==='escape'&&!e.repeat){togglePause();return}if(k===' '&&!keys.has(k))jumpQueued=true;keys.add(k)});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();jumpQueued=false;if(['combat','boss'].includes(phase)&&!paused)togglePause()});
$('#pause').onclick=togglePause;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐'};for(const b of document.querySelectorAll('#touch button')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);if(b.dataset.key===' ')jumpQueued=true};b.onpointerup=()=>keys.delete(b.dataset.key);b.onpointercancel=()=>keys.delete(b.dataset.key)}
function loop(now){const dt=Math.min(.05,(now-last)/1000)||.016;last=now;update(dt);render();requestAnimationFrame(loop)}
(async()=>{try{await Promise.all(Object.entries(window.__ASSETS__).map(async([key,a])=>{const im=new Image();im.src='data:'+a.mime+';base64,'+a.base64;await im.decode();IMG[key]=im}));title();last=performance.now();requestAnimationFrame(loop)}catch(err){phase='error';overlay('<h2>자산을 불러오지 못했습니다.</h2><p class="desc">HTML 파일이 온전히 저장됐는지 확인하세요.<br>'+String(err.message).replace(/[<>]/g,'')+'</p>');$('#game').dataset.state='error'}})();

</script>
